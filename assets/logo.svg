<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="rsredact">
  <title>rsredact</title>
  <rect width="128" height="128" rx="28" fill="#6D28D9"/>
  <!-- Same page and folded corner as rsparse: these are sibling services. -->
  <path d="M20 26a10 10 0 0 1 10-10h50l28 28v58a10 10 0 0 1-10 10H30a10 10 0 0 1-10-10Z" fill="#F4EFFF"/>
  <path d="M80 16l28 28H90a10 10 0 0 1-10-10Z" fill="#2E1065"/>
  <!--
    Two bars of ink, uneven, the way a real redaction falls across a line.
    Both run past the page edge, because ink applied afterwards does not
    respect the text block. Bars inset from both margins read as lines of
    text instead, which is every document icon ever drawn. Every number is a
    multiple of 8 so the edges land on whole pixels down to 16px.
  -->
  <rect x="20" y="56" width="88" height="24" fill="#2E1065"/>
  <rect x="20" y="88" width="48" height="16" fill="#2E1065"/>
</svg>
